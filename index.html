<html lang="en">

<style>:root {
  --bg: #0b1424;
  --glass: rgba(16, 24, 38, 0.70);
  --glass-strong: rgba(14, 20, 32, 0.80);
  --line: rgba(255, 255, 255, 0.14);
  --fill: rgba(255, 255, 255, 0.06);
  --fill-2: rgba(255, 255, 255, 0.10);
  --fill-3: rgba(255, 255, 255, 0.22);
  --text: #f3f6fb;
  --muted: rgba(235, 242, 252, 0.76);
  --ink: #13202f;
  --knob: #fff;
  --accent: #5fe0d0;
  --accent-bg: rgba(95, 224, 208, 0.18);
  --accent2: #ffb25e;
  --hot: #ffc28f;
  --hot-line: rgba(255, 150, 80, 0.5);
  --hot-bg: rgba(255, 120, 40, 0.14);
  --halo: rgba(11, 20, 36, 0.8);
  --blur: blur(14px) saturate(1.3);
  --blur-strong: blur(20px) saturate(1.4);
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
/* the canvas takes focus for the camera keys: its ring sits inside the viewport, on a halo */
#scene:focus-visible { outline: 2px solid var(--text); outline-offset: -8px; }
@supports selector(:has(a)) {
  #scene:focus-visible { outline: none; }
  body:has(#scene:focus-visible)::after { content: ""; position: fixed; inset: 4px; z-index: 1; pointer-events: none; border: 2px solid var(--text); border-radius: 14px; box-shadow: 0 0 0 4px var(--halo), inset 0 0 0 4px var(--halo); }
}
button { font: inherit; color: inherit; }
.ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; transition: opacity .35s ease; }
.ui > * { pointer-events: auto; }
.hidden-ui .ui .hideable { opacity: 0; pointer-events: none; transform: translateY(6px); }
.hideable { transition: opacity .35s ease, transform .35s ease; }

.chip { position: absolute; top: calc(10px + var(--sa-t)); left: calc(10px + var(--sa-l)); display: flex; align-items: center; gap: 10px;
  min-height: 48px; padding: 6px 14px 6px 8px; border-radius: 26px; background: var(--glass); border: 1px solid var(--line);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); cursor: pointer; max-width: calc(100vw - 90px);
  box-shadow: var(--shadow); text-align: left; }
.chip .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-2); flex: none; }
.chip .ic svg { width: 24px; height: 24px; }
.chip .t1 { font-size: 15px; font-weight: 600; letter-spacing: .1px; line-height: 1.15; white-space: nowrap; }
.chip .t1 .time { font-weight: 500; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.chip .t2 { font-size: 12px; color: var(--muted); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.chip .t2 b { color: var(--text); font-weight: 600; }

.fab { position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }
.fab svg { width: 24px; height: 24px; }
.fab.menu { right: calc(14px + var(--sa-r)); bottom: calc(16px + var(--sa-b)); }
.fab.erupt { right: calc(14px + var(--sa-r)); bottom: calc(82px + var(--sa-b)); width: 48px; height: 48px; color: var(--hot); }
.fab.restore { right: calc(14px + var(--sa-r)); bottom: calc(16px + var(--sa-b)); width: 44px; height: 44px; opacity: 0; pointer-events: none; transition: opacity .3s; }
.hidden-ui .fab.restore { opacity: .38; pointer-events: auto; }
.hidden-ui .fab.restore:hover, .hidden-ui .fab.restore:focus-visible { opacity: 1; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: min(66vh, 600px); overflow-y: auto; overscroll-behavior: contain;
  background: var(--glass-strong); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
  backdrop-filter: var(--blur-strong); -webkit-backdrop-filter: var(--blur-strong);
  padding: 8px calc(16px + var(--sa-r)) calc(18px + var(--sa-b)) calc(16px + var(--sa-l));
  transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgba(0,0,0,.3); }
.open .sheet { transform: translateY(0); }
.open .fab.menu, .open .fab.erupt { opacity: 0; pointer-events: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--fill-3); margin: 2px auto 6px; }
.sheet h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; margin: 16px 2px 10px; }
.head { display: flex; align-items: center; justify-content: space-between; }
.head .title { font-size: 17px; font-weight: 700; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--fill-2); display: grid; place-items: center; cursor: pointer; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.row .lbl { font-size: 15px; }
.row .lbl small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

.switch { position: relative; width: 56px; height: 44px; border: 0; background: transparent; cursor: pointer; flex: none; padding: 0; }
.switch::before { content: ""; position: absolute; left: 4px; right: 4px; top: 9px; height: 26px; border-radius: 13px; background: var(--fill-3); transition: background .2s; }
.switch::after { content: ""; position: absolute; left: 7px; top: 12px; width: 20px; height: 20px; border-radius: 50%; background: var(--knob); transition: transform .22s cubic-bezier(.3,1.4,.5,1); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch[aria-checked="true"]::before { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }

.wgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.wbtn { position: relative; min-height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--fill); cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 4px; font-size: 12px; line-height: 1.2; text-align: center; color: var(--muted); }
.wbtn svg { width: 24px; height: 24px; color: var(--text); }
.wbtn.on { background: var(--accent-bg); border-color: var(--accent); color: var(--text); }
.wbtn.next::after { content: "next"; position: absolute; top: -7px; right: 6px; padding: 0 6px; border-radius: 7px; font-size: 10px; line-height: 14px; font-weight: 600;
  letter-spacing: .3px; color: var(--ink); background: var(--accent2); }

.seg { display: flex; background: var(--fill); border-radius: 14px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 44px; border: 0; background: transparent; border-radius: 11px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button.on { background: var(--text); color: var(--ink); }

.slider { width: 100%; height: 44px; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; margin: 0; }
.slider::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #142048, #3a3f7a 18%, #ff9a6a 25%, #8fd0ff 35%, #8fd0ff 65%, #ff9a6a 75%, #3a3f7a 82%, #142048); }
.slider::-moz-range-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #142048, #3a3f7a 18%, #ff9a6a 25%, #8fd0ff 35%, #8fd0ff 65%, #ff9a6a 75%, #3a3f7a 82%, #142048); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--knob); margin-top: -10px; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.slider::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--knob); border: 0; }
.timeval { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }

.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.abtn { min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--fill); cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.abtn svg { width: 22px; height: 22px; flex: none; }
.abtn.on { border-color: var(--accent); background: var(--accent-bg); }
.abtn.hot { color: var(--hot); border-color: var(--hot-line); background: var(--hot-bg); }
.note { font-size: 12px; color: var(--muted); margin: 14px 2px 0; line-height: 1.45; }

.toast { position: absolute; left: 50%; top: calc(70px + var(--sa-t)); transform: translate(-50%, -8px); padding: 8px 14px; border-radius: 18px; background: var(--glass);
  border: 1px solid var(--line); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); font-size: 13px; font-weight: 600; line-height: 1.35; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
  width: max-content; max-width: min(420px, calc(100vw - 32px - var(--sa-l) - var(--sa-r))); text-align: center; text-wrap: balance; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: radial-gradient(circle at 50% 40%, #1d4f7a, var(--bg)); z-index: 5; }
.fail div { max-width: 420px; line-height: 1.5; font-size: 15px; color: var(--muted); }
.fail b { display: block; font-size: 20px; color: var(--text); margin-bottom: 8px; }

/* landscape / desktop: side panel */
@media (min-width: 760px), (orientation: landscape) and (max-height: 560px) {
  .sheet { left: auto; top: calc(10px + var(--sa-t)); right: calc(10px + var(--sa-r)); bottom: calc(10px + var(--sa-b)); width: 360px; max-height: none;
    border-radius: 22px; border: 1px solid var(--line); transform: translateX(calc(100% + 30px)); padding: 10px 16px 18px; }
  .open .sheet { transform: translateX(0); }
  .grab { display: none; }
}
@media (orientation: landscape) and (max-height: 560px) {
  .sheet { width: min(360px, 52vw); }
  .chip .t2 { max-width: 40vw; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .toast, .hideable { transition: none; } }

/* keyboard focus ring (mouse and touch clicks stay ring-free) */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
/* controls that are faded out are also taken out of the Tab order */
.fab.restore, .open .fab.menu, .open .fab.erupt, .hidden-ui .ui .hideable { visibility: hidden; }
.hidden-ui .fab.restore { visibility: visible; }
.hidden-ui .ui .hideable { transition: opacity .35s ease, transform .35s ease, visibility 0s linear .35s; }
.switch:focus-visible { outline-offset: -2px; border-radius: 22px; }
.slider:focus-visible { outline-offset: 0; border-radius: 8px; }
/* the chip and the round buttons sit over the scene: a dark halo keeps the ring visible on snow */
.chip:focus-visible, .fab:focus-visible { box-shadow: 0 0 0 6px var(--halo); }
/* the closed panel is off screen: keep it out of the Tab order too */
.sheet { visibility: hidden; transition: transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s linear .38s; }
.open .sheet { visibility: visible; transition: transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s; }
@media (prefers-reduced-motion: reduce) { .sheet, .open .sheet, .hidden-ui .ui .hideable { transition: none; } }
@media (prefers-reduced-motion: reduce) { .ui, .switch::before, .switch::after, .fab.restore { transition: none; } }

#loading { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: radial-gradient(circle at 50% 45%, #6fb6e8, #2c6fa8 55%, var(--bg)); color: var(--text); font-size: 15px; letter-spacing: .3px; transition: opacity .6s ease; }
#loading.done { opacity: 0; pointer-events: none; }
.ld-dot { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #7fe0c8, #2aa59a 60%, #1c6f8f); box-shadow: 0 0 0 6px rgba(255,255,255,.12); animation: ldp 1.4s ease-in-out infinite; }
@keyframes ldp { 50% { transform: scale(.86); box-shadow: 0 0 0 14px rgba(255,255,255,.05); } }
@media (prefers-reduced-motion: reduce) { .ld-dot { animation: none; } }
</style>
</head>
<body>
<div id="loading"><div class="ld-dot"></div><span>Shaping a tiny island…</span></div>
<noscript><div class="fail"><div><b>The tiny island needs JavaScript</b>Please enable JavaScript to see the diorama.</div></div></noscript>
<script id="boat-hull">
/*
  Boat hull builder, shared by every boat on the island (the bundle's hull
  helper delegates here, and plugins get it as kit.hull).

  boatHull(T, length, beam, height, hullColor, deckColor, options) -> BufferGeometry
    T        three.js classes from the bundle: { BufferGeometry, Float32BufferAttribute, Color }
    frame    bow points along +x, stern at -length/2, y up, beam along z.
             Keel (midships) at y = -height/2, deck (midships) at y = +height/2,
             same frame as the old box hull so cabins and masts still sit on deck.
    options  bowRise / sternRise: how far the sheer climbs at bow / stern (x height)
             bulwark: rail height above the deck (x height)
             transom: stern width as a fraction of the beam
             rake:    how far the stem leans forward (x length)
             trimColor: colour of the top strake (a rail stripe that follows the sheer)
             bottomColor: below-the-waterline paint (default: darker hull colour)
             segments: stations along the length

  Shape: pointed, raked bow; round bilge (elliptical sections); narrower transom;
  a sheer line rising towards bow and stern; a deck inset below the rail that
  follows the sheer. Flat-shaded low-poly faces with baked vertex colours.
  geometry.userData has deckAt(x), sheerAt(x) and sideAt(x, y) (half-width of the
  hull at height y) so callers can seat masts, cabins and gun ports on it.
*/
window.__islandBoatHull = function boatHull(T, L, B, H, hullColor, deckColor, o) {
  o = o || {};
  const bowRise = o.bowRise ?? 0.32, sternRise = o.sternRise ?? 0.12;
  const bw = (o.bulwark ?? 0.1) * H, transom = o.transom ?? 0.62, rake = (o.rake ?? 0.07) * L;
  const N = o.segments ?? 12, K = 4;                 // stations along, facets per side
  const hullC = new T.Color(hullColor), deckC = new T.Color(deckColor);
  const bottomC = o.bottomColor != null ? new T.Color(o.bottomColor) : hullC.clone().multiplyScalar(0.7);
  const trimC = o.trimColor != null ? new T.Color(o.trimColor) : hullC;
  const transomC = hullC.clone().multiplyScalar(0.85);

  // u: 0 at the transom, 1 at the stem
  const halfW = (u) => (B / 2) * (u < 0.42 ? transom + (1 - transom) * Math.sin((u / 0.42) * Math.PI / 2)
    : Math.max(0.03, Math.pow(Math.max(0, Math.cos(((u - 0.42) / 0.58) * Math.PI / 2)), 0.85)));
  const sheer = (u) => H / 2 + bw + H * (u > 0.5 ? bowRise * ((u - 0.5) / 0.5) ** 2 : sternRise * ((0.5 - u) / 0.5) ** 2);
  const keel = (u) => -H / 2 + H * (0.8 * Math.max(0, (u - 0.6) / 0.4) ** 2 + 0.18 * Math.max(0, (0.12 - u) / 0.12));
  const xAt = (u) => -L / 2 + u * L;
  const uOf = (x) => Math.min(1, Math.max(0, (x + L / 2) / L));

  // point on the hull skin: station u, facet angle a (0 = rail, PI/2 = keel), side s (+1/-1)
  function skin(u, a, s, out) {
    const top = sheer(u), D = top - keel(u);
    const depth = Math.sin(a);                                              // 0 at rail, 1 at keel (ellipse)
    const bowK = Math.max(0, (u - 0.72) / 0.28);
    out[0] = xAt(u) - rake * depth * bowK;
    out[1] = top - D * depth;
    out[2] = s * halfW(u) * Math.cos(a);
    return out;
  }

  const pos = [], col = [];
  const tri = (a, b, c, color, wantX, wantY, wantZ) => {
    // keep faces wound outwards (matters for snow/wet shading, which reads the normal)
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    if (nx * nx + ny * ny + nz * nz < 1e-12) return;                       // skip degenerate slivers
    const flip = nx * wantX + ny * wantY + nz * wantZ < 0;
    const p = flip ? [a, c, b] : [a, b, c];
    for (const v of p) { pos.push(v[0], v[1], v[2]); col.push(color.r, color.g, color.b); }
  };
  const quad = (a, b, c, d, color, wx, wy, wz) => { tri(a, b, c, color, wx, wy, wz); tri(a, c, d, color, wx, wy, wz); };
  const P = () => [0, 0, 0];

  // shell
  for (let i = 0; i < N; i++) {
    const u0 = i / N, u1 = (i + 1) / N;
    for (const s of [-1, 1]) for (let k = 0; k < K; k++) {
      const a0 = (k / K) * Math.PI / 2, a1 = ((k + 1) / K) * Math.PI / 2;
      const p00 = skin(u0, a0, s, P()), p01 = skin(u0, a1, s, P()), p10 = skin(u1, a0, s, P()), p11 = skin(u1, a1, s, P());
      const midA = (a0 + a1) / 2;
      const color = k === 0 ? trimC : k >= K - 2 ? bottomC : hullC;
      quad(p00, p10, p11, p01, color, 0, -Math.sin(midA), s * Math.cos(midA));
    }
  }
  // transom: a fan across the stern section
  {
    const ring = [];
    for (let k = 0; k <= K; k++) ring.push(skin(0, (k / K) * Math.PI / 2, 1, P()));
    for (let k = K - 1; k >= 0; k--) ring.push(skin(0, (k / K) * Math.PI / 2, -1, P()));
    const c = [xAt(0), (sheer(0) + keel(0)) / 2, 0];
    for (let k = 0; k < ring.length - 1; k++) tri(c, ring[k], ring[k + 1], transomC, -1, 0, 0);
    tri(c, ring[ring.length - 1], ring[0], transomC, -1, 0, 0);
  }
  // deck: inset below the rail, following the sheer
  const deckAt = (x) => sheer(uOf(x)) - bw;
  const sideAt = (x, y) => {
    const u = uOf(x), top = sheer(u), D = top - keel(u);
    const depth = Math.min(1, Math.max(0, (top - y) / D));
    return halfW(u) * Math.sqrt(1 - depth * depth);
  };
  for (let i = 0; i < N; i++) {
    const u0 = i / N, u1 = (i + 1) / N, x0 = xAt(u0), x1 = xAt(u1);
    const y0 = deckAt(x0), y1 = deckAt(x1), w0 = sideAt(x0, y0) * 0.98, w1 = sideAt(x1, y1) * 0.98;
    quad([x0, y0, -w0], [x1, y1, -w1], [x1, y1, w1], [x0, y0, w0], deckC, 0, 1, 0);
  }

  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  g.userData = { deckAt, sheerAt: (x) => sheer(uOf(x)), sideAt, length: L, beam: B, height: H };
  return g;
};
</script>
<script id="ships">
/*
  Ships: an occasional galleon and a (friendly) pirate ship sail around the island.
  When both are out at the same time the pirates "attack": cannon puffs and splashes
  that always miss. Nobody gets hurt, nothing burns or sinks.

  This is a plugin for the island bundle below. The bundle calls every factory in
  window.__islandPlugins with a `kit` (three.js classes and island helpers under
  readable names), adds the returned `group` to the scene and calls
  `update(t, dt, env)` every frame:
    t   = wave clock (same clock the water shader uses)
    dt  = real seconds since the last frame (also when driven by __island.step)
    env = { sea, wind, ice, calmK, lights, night, rain, snow, ... }
  `name` + `api` are published as window.__island[name].

    for (let i = 0; i < n; i++) { enc.plan.push('P'); if (i === 1 || i === 3) enc.plan.push('G'); }

    forceMeet = false;
    kit.toast('Pirates ahoy!');
  }
  function updateEncounter(dt, t, env) {
    enc.t += dt;
    const g = galleon, p = pirate;
    const gap = angleDiff(g.th, p.th);                 // >0: galleon is ahead of the pirate

      // pirate swings round and runs alongside, just inside the galleon and
      // half a length behind it (so the two never hide each other on screen)

      const lag = STAGGER / g.r, off = gap - lag;
      const want = g.omega + clamp(off * 0.6, -0.05, 0.05);

        enc.next -= dt;

          enc.next = 1.5 + rand() * 0.5;

      p.omega += (g.baseOmega * 0.5 - p.omega) * Math.min(1, dt * 0.6);
      p.rTarget = p.lane;
      if (!enc.cheered && enc.t > 2.5 && (gap * g.r > 14 || enc.t > 7)) {
        enc.cheered = true;
        kit.toast('The galleon got away!');
        enc.phase = 'peel'; enc.t = 0;
      }

      // pirate gives up and turns back the way it came; galleon eases off
      p.omega += (p.baseOmega - p.omega) * Math.min(1, dt * 0.5);
      g.omega += (g.baseOmega - g.omega) * Math.min(1, dt * 0.3);
      if (enc.t > 5) {
        leave(p);
        g.visit = Math.min(g.visit, 15 + rand() * 10);

  }

  // ---------- per-frame ----------------------------------------------------
  // no sailing on a frozen sea, in a thunderstorm or in a gale
  const cond = { frozen: false, rough: false, blocked: false };
  function conditions(env) {
    cond.frozen = env.ice > 0.2;
    cond.rough = env.sea > 0.8 || env.calmK < 0.7 || env.wind > 0.8;
    cond.blocked = cond.frozen || cond.rough;
    return cond;
  }

  function moveShip(s, dt, t, env) {
    s.th += s.omega * dt;
    const dr = clamp((s.rTarget - s.r) * 0.6, -2.2, 2.2) * dt;
    s.r += dr;
    const nx = Math.cos(s.th) * s.r, nz = Math.sin(s.th) * s.r;
    const vx = nx - s.x, vz = nz - s.z;
    s.x = nx; s.z = nz;
    // turn towards the direction of travel; nearly stopped ships (the pirate
    // swinging round) pivot faster, towards the way they are about to go
    const speed = dt > 0 ? Math.hypot(vx, vz) / dt : 0;
    const want = speed > 0.3 ? Math.atan2(vz, vx) : s.th + (s.omega >= 0 ? Math.PI / 2 : -Math.PI / 2);
    const maxTurn = (0.5 + 1.1 * (1 - Math.min(1, speed / 1.6))) * dt;
    s.heading += clamp(angleDiff(want, s.heading), -maxTurn, maxTurn);
    // bob and roll on the same waves the water shader draws
    const sea = env.sea, h0 = waveHeight(s.x, s.z, t, sea);
    const fx = Math.cos(s.heading), fz = Math.sin(s.heading);
    const L = s.halfLen * 0.6, B = s.beam;
    const pitch = (waveHeight(s.x + fx * L, s.z + fz * L, t, sea) - waveHeight(s.x - fx * L, s.z - fz * L, t, sea)) / (2 * L);
    const roll = (waveHeight(s.x - fz * B, s.z + fx * B, t, sea) - waveHeight(s.x + fz * B, s.z - fx * B, t, sea)) / (2 * B);
    const ease = s.k < 1 ? 1 + 2.2 * Math.pow(s.k - 1, 3) + 1.2 * Math.pow(s.k - 1, 2) : 1;   // ease-out-back
    s.root.position.set(s.x, h0 - (1 - s.k) * 1.2, s.z);
    s.root.rotation.set(
      -roll * 0.8 - 0.02 - env.wind * 0.03 + Math.sin(t * 0.9 + s.phase) * 0.02,   // roll: lean a little with the wind
      -s.heading,
      pitch * 0.6 + 0.02 + Math.sin(t * 1.1 + s.phase) * 0.01);           // pitch: bow up when the wave ahead is higher, slight bow-up trim
    s.root.scale.setScalar(Math.max(0.001, ease) * SCALE);
  }

  function update(t, dt, env) {
    conditions(env);
    // queued sprays (arrive/leave) happen once the ship has a position
    while (sprayPending.length) spray(sprayPending.pop(), t, env.sea);

    if (cond.blocked) {
      if (enc) enc = null;
      for (const s of ships) leave(s);
    }
    for (const s of ships) {
      switch (s.state) {
        case 'away':
          s.timer -= dt;
          if (cond.blocked && s.timer < 5) s.timer = 5;
          if (s.timer <= 0) {
            if (s === galleon) {
              arrive(galleon, rand() * TAU);
              if (pirate.state === 'away' && rand() < 0.75) {
                // set the pirate up to meet the galleon head-on in ~20 s
                pirate.timer = 3 + rand() * 5;
                pirate.meetAt = 1.2 + rand() * 0.4;
              }
            } else {
              const ahead = pirate.meetAt && galleon.state !== 'away' ? galleon.th + galleon.omega * 3 + pirate.meetAt : rand() * TAU;
              pirate.meetAt = 0;
              arrive(pirate, ahead);
            }
          }
          break;
        case 'arriving':
          s.k = Math.min(1, s.k + dt / 2.5);
          if (s.k >= 1) s.state = 'cruising';
          break;
        case 'cruising':
          if (!enc) s.visit -= dt;
          if (s.visit <= 0 && !enc) leave(s);
          break;
        case 'leaving':
          s.k = Math.max(0, s.k - dt / 2);
          if (s.k <= 0) scheduleAfterLeaving(s);
          break;
      }
      if (s.state !== 'away') moveShip(s, dt, t, env);
    }
    // keep sailing their own way when not engaged
    if (!enc) {
      for (const s of ships) if (s.state !== 'away') {
        s.omega += (s.baseOmega - s.omega) * Math.min(1, dt * 0.4);
        s.rTarget = s.lane;
      }
      if (!cond.blocked && galleon.state === 'cruising' && pirate.state === 'cruising' && (forceMeet || !metThisVisit) &&

    } else updateEncounter(dt, t, env);

    // --- effects ---
    let any = false;
    for (let i = 0; i < puffs.length; i++) {
      const p = puffs[i];
      if (p.on) {
        p.age += dt;
        if (p.age >= p.life) p.on = false;
      }
      if (!p.on) { puffMesh.setMatrixAt(i, ZERO); continue; }
      any = true;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;

      puffMesh.setMatrixAt(i, M);
    }
    puffMesh.visible = any; puffMesh.instanceMatrix.needsUpdate = true;

    any = false;
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      if (b.on) {
        b.age += dt;
        if (b.age >= b.T) {
          b.on = false;
          stats.landings++;
          for (const s of ships) {           // distance to BOTH hulls, not only the one aimed at
            const miss = Math.hypot(b.ex - s.x, b.ez - s.z);
            stats.minMiss[s.name] = Math.min(stats.minMiss[s.name], miss);
            if (miss < s.hullRadius) console.warn('ships: cannonball landed inside a hull radius', s.name, b.mode, miss);
          }
          splash(b.ex, b.ez, t, env.sea);
        }
      }
      if (!b.on) { ballMesh.setMatrixAt(i, ZERO); continue; }
      any = true;
      const u = b.age / b.T;
      V.set(b.sx + (b.ex - b.sx) * u, b.sy * (1 - u) + 4 * b.apex * u * (1 - u), b.sz + (b.ez - b.sz) * u);
      M.compose(V, IDQ, S.setScalar(SCALE));
      ballMesh.setMatrixAt(i, M);
    }
    ballMesh.visible = any; ballMesh.instanceMatrix.needsUpdate = true;

    any = false;
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      if (d.on) {
        d.vy -= 14 * dt;
        d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
        if (d.vy < 0 && d.y < d.floor) d.on = false;
      }
      if (!d.on) { dropMesh.setMatrixAt(i, ZERO); continue; }
      any = true;
      M.compose(V.set(d.x, d.y, d.z), IDQ, S.set(1, 1.5, 1));
      dropMesh.setMatrixAt(i, M);
    }
    dropMesh.visible = any; dropMesh.instanceMatrix.needsUpdate = true;

    any = false;
    for (let i = 0; i < ripples.length; i++) {
      const r = ripples[i];
      if (r.on) { r.age += dt; if (r.age >= r.life) r.on = false; }
      if (!r.on) { rippleMesh.setMatrixAt(i, ZERO); continue; }

      s.root.updateMatrix();

      lanternMesh.setMatrixAt(i, M);
      glowMesh.setMatrixAt(i, M);

  let lastEnv = null;

      const cam = kit.camera.position;
      // meet just beside the middle of the view; the encounter then drifts
      // across it. With the pirate trailing by STAGGER the two ships stay
      // side by side on screen instead of one hiding the other.

    },

        galleon: one(galleon), pirate: one(pirate), encounter: enc ? enc.phase : null,
        shots: stats.shots, landings: stats.landings,
        minMiss: { galleon: +stats.minMiss.galleon.toFixed(2), pirate: +stats.minMiss.pirate.toFixed(2) },

    },
    /** Shallowest water (terrain height, negative = depth) along each lane, sampled every degree. */
    terrain: terrainHeight,
    _tune(o) { if (o.offset != null) SUMMON_OFFSET = o.offset; if (o.stagger != null) STAGGER = o.stagger; },
    laneCheck() {
      const out = {};
      for (const [k, r] of [['galleon', GALLEON_R], ['pirate', PIRATE_R]]) {
        let worst = -Infinity;
        for (let i = 0; i < 360; i++) {
          const a = (i / 360) * TAU;
          for (const dr of [-2, 0, 2]) worst = Math.max(worst, terrainHeight(Math.cos(a) * (r + dr), Math.sin(a) * (r + dr)));
        }
        out[k] = +worst.toFixed(2);
      }
      return out;
    },

    name: 'ships',
    group,
    api,
    update(t, dt, env) { lastEnv = env; update(t, dt, env); },

});
